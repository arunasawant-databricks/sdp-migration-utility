# Databricks Asset Bundle — SDP migration utility.
# Backfills a source region's historical bronze data (exposed via Delta Share)
# into the target region's pipeline-owned bronze streaming tables:
# containment DELETE -> INSERT -> verify. One deployment per Business Unit.
# Reusable for any streaming table.
bundle:
  name: sdp_migration_utility

include:
  - resources/*.yml

variables:
  # THIS FILE IS THE ENTIRE DEPLOYER CONFIG SURFACE. Every setting below is passed to the
  # job as a parameter and consumed at run time. The only other thing to edit is
  # src/config/tables.csv (the per-table row list). Per-table cells in tables.csv override
  # the shared_/target_ catalog+schema defaults set here.

  # --- Delta-share (read) source: source-region bronze STs exposed on the target ---
  shared_catalog:
    description: Delta-shared catalog on the target that exposes the source region's bronze STs
    default: sdp_shared_from_source
  shared_schema:
    description: Schema under the shared catalog
    default: sdp_bronze

  # --- Backfill target: the target region's own pipeline-owned bronze STs ---
  target_catalog:
    description: Target catalog holding the target bronze streaming tables
    default: <target_catalog>
  target_schema:
    description: Schema holding the target bronze streaming tables
    default: sdp_bronze

  # --- Control / state table (sdp_-prefixed) ---
  control_catalog:
    description: Catalog for the migration control table
    default: <target_catalog>
  control_schema:
    description: Schema for the migration control table
    default: sdp_migration
  control_table:
    description: Control table name
    default: sdp_migration_control

  # --- Runtime knobs ---
  max_parallel_tables:
    description: Bounded concurrency for the For each task (tables migrated in parallel)
    default: 10

  # --- Classic-compute option (instance pools) ---
  # Used ONLY by the sdp_migration_job_classic job; the default sdp_migration_job stays
  # serverless. The instance pool itself lives OUTSIDE this bundle: supply a real
  # instance_pool_id from a classic-compute workspace at deploy time
  # (`-var instance_pool_id=<id>`). Empty defaults keep the bundle valid but the classic job
  # will not launch until a real pool id is provided in a workspace that supports classic compute.
  instance_pool_id:
    description: Worker instance pool id for the classic job cluster (empty = not configured)
    default: ""
  driver_instance_pool_id:
    description: Driver instance pool id for the classic job cluster (set equal to the worker pool to share one)
    default: ""
  spark_version:
    description: Databricks Runtime version for the classic job cluster
    default: 16.4.x-scala2.12
  classic_max_workers:
    description: Autoscale upper bound (max_workers) for the classic job cluster; the cluster
      autoscales 1..this value, so the worker count is never fixed. Override per deploy.
    default: 10

  # --- Migration payload (this deployment serves ONE Business Unit) ---
  business_unit:
    description: Business Unit this deployment migrates (one BU per deployment/repo)
    default: bu_demo
  timezone:
    description: Session timezone for cut_off comparisons (checkpoint_col <= cut_off_date)
    default: Asia/Kolkata
  tables_csv:
    description: Per-table CSV filename under src/config (only the name is a var; the row
      contents stay in the file so large table lists aren't limited by job-parameter size)
    default: tables.csv

targets:
  # Deploy with: databricks bundle deploy -t target --profile <your-profile>
  target:
    default: true
    workspace:
      host: https://<your-workspace>.cloud.databricks.com
