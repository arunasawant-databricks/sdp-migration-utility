# ---------------------------------------------------------------------------
# SDP migration utility — input config (Region 2 backfill).
# One config per Business Unit; eg Monility, Home, etc.
# The utility reads this, then per table: containment DELETE (<= cut_off) ->
# INSERT the Delta-shared rows (<= cut_off) -> verify row-count parity.
#
# Timestamps are INDIA / IST (Asia/Kolkata). The utility sets the session
# timezone so `checkpoint_col <= cut_off_date` is compared in IST.
# ---------------------------------------------------------------------------
version: 1
business_unit: bu_demo

# Reusable defaults applied to every table (a table entry may override any of these).
defaults:
  shared_catalog: <shared_catalog>   # Delta-share read path (source-region STs on the target)
  shared_schema: sdp_bronze
  target_catalog: <target_catalog>   # target-region catalog holding the target STs
  target_schema: sdp_bronze
  timezone: Asia/Kolkata

# Control / state table (sdp_-prefixed) — progress, resume, reporting.
control:
  catalog: <target_catalog>
  schema: sdp_migration
  table: sdp_migration_control

# Per-table list lives in the CSV below (path relative to this file). Edit tables.csv —
# not this file — to add/change tables. See tables.csv and README.md for column details.
tables_csv: tables.csv
